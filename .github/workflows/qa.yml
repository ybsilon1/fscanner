name: QA

on:
  push:
    branches-ignore: ["main"]
  pull_request:
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check fscanner/

      - name: Format check (ruff)
        run: uv run ruff format --check fscanner/

      - name: Type check (ty)
        run: uv run ty check fscanner/
