[project]
name = "fscanner"
version = "0.1.0"
description = "Forex candidate scanner — scans 50 pairs and sends Telegram alerts"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "requests>=2.34.2",
]

[project.scripts]
fscanner = "fscanner.scanner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ty.environment]
python-version = "3.13"
